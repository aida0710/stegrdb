[workspace]
members = ["crates/relay", "plugins/memory", "plugins/postgres"]
resolver = "2"

[package]
name = "stegrdb"
version = "0.2.0"
authors = ["相田 優希 <51500566+aida0710@users.noreply.github.com>"]
edition = "2021"

[features]
default = ["postgres"]
postgres = ["dep:stegrdb-relay-postgres"]

[dependencies]
async-trait = "0.1"
bytes = "1"
dotenv = "0.15"
env_logger = "0.11"
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stegrdb-relay = { path = "crates/relay" }
stegrdb-relay-memory = { path = "plugins/memory" }
stegrdb-relay-postgres = { path = "plugins/postgres", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
uuid = { version = "1", features = ["v4"] }

[[bench]]
name = "packet_pipeline"
harness = false
